<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lety Videz</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1B1816">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Identidad: Ébano · Marfil · Burdeos · Latón */
  :root { --ebano:#1B1816; --marfil:#F6EFE2; --blanco:#FDFBF6; --burdeos:#7B1F2B; --laton:#B38F5A; --gris:#5C554D;
          --serif:'Cormorant Garamond',Georgia,serif; --sans:'Work Sans',system-ui,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--marfil); color:var(--ebano); font-family:var(--sans); }
  a { color:inherit; text-decoration:none; }
  .wrap { max-width:560px; margin:0 auto; padding:0 24px 120px; }

  /* Teclas de piano decorativas */
  .teclas { height:18px; display:flex; justify-content:center; gap:0; max-width:560px; margin:0 auto; }
  .teclas i { width:15px; background:var(--ebano); margin:0 27px; }
  .teclas i.r { background:var(--burdeos); }

  /* Inicio */
  .saludo { margin:44px 0 0; color:var(--gris); font-size:1.15rem; }
  .nombre { display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .nombre h1 { font-family:var(--serif); font-weight:500; font-size:3.4rem; line-height:1; margin:6px 0 24px; }
  .nombre h1 em { color:var(--burdeos); }
  .nombre img { width:72px; height:72px; border-radius:50%; object-fit:cover; border:2px solid var(--laton); margin-bottom:18px; }
  .hoy { background:var(--ebano); color:var(--marfil); border-radius:22px; padding:24px; margin-bottom:28px; }
  .etq { color:var(--laton); font-weight:700; letter-spacing:.22em; font-size:.8rem; text-transform:uppercase; }
  .hoy h2 { font-family:var(--serif); font-weight:500; font-size:2rem; margin:10px 0 4px; }
  .hoy p { margin:0 0 20px; color:#d8cfbf; }
  .btn { display:flex; align-items:center; justify-content:center; gap:12px; width:100%; border:none; border-radius:16px;
         background:var(--burdeos); color:#fff; font:700 1.25rem var(--sans); padding:18px; cursor:pointer; }
  .btn.borde { background:none; border:2px solid var(--marfil); color:var(--marfil); }
  .subt { font-family:var(--serif); font-size:1.6rem; font-weight:600; margin:0 0 14px; }
  .discos { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .disco { background:var(--blanco); border:2px solid var(--ebano); border-radius:18px; overflow:hidden; transition:transform .15s; }
  .disco:hover { transform:translateY(-3px); }
  .disco img { width:100%; aspect-ratio:1; object-fit:contain; background:var(--ebano); display:block; border-bottom:2px solid var(--ebano); }
  .disco div { padding:12px 14px 14px; }
  .disco small { color:var(--burdeos); font-weight:700; letter-spacing:.12em; font-size:.7rem; text-transform:uppercase; }
  .disco b { display:block; font-family:var(--serif); font-size:1.35rem; font-weight:600; line-height:1.15; margin-top:2px; }
  .bio { margin:28px 0 0; background:var(--blanco); border:2px solid var(--ebano); border-radius:18px; overflow:hidden; }
  .bioBtn { width:100%; background:none; border:none; color:var(--ebano); cursor:pointer; padding:16px 18px; font-family:var(--serif); font-size:1.6rem; font-weight:600; display:flex; justify-content:space-between; align-items:center; text-align:left; }
  .bioBtn::after { content:'+'; color:var(--burdeos); font-family:var(--sans); font-size:1.6rem; }
  .bio.open .bioBtn::after { content:'−'; }
  .bio div { display:none; padding:0 18px 8px; border-top:1px solid #e3d9c6; }
  .bio.open div { display:block; }
  .bio p { line-height:1.6; margin:14px 0; }
  .firma { text-align:center; font-family:var(--serif); font-style:italic; color:var(--burdeos); font-size:1.6rem; margin:48px 0 0; }

  /* Página de disco */
  .volver { display:inline-flex; width:52px; height:52px; border-radius:50%; border:2px solid var(--ebano); align-items:center; justify-content:center; font-size:1.4rem; margin:28px 0 20px; }
  .caratula { width:min(100%,420px); margin:0 auto; aspect-ratio:1; object-fit:contain; background:var(--ebano); border-radius:20px; border:2px solid var(--ebano); display:block; }
  .cab h2 { font-family:var(--serif); font-weight:500; font-size:2.6rem; margin:14px 0 2px; line-height:1; }
  .cab p { color:var(--gris); margin:0 0 18px; }
  ol { list-style:none; padding:0; margin:20px 0 0; }
  li { display:flex; align-items:center; gap:14px; padding:14px 6px; border-bottom:1px solid #e3d9c6; cursor:pointer; }
  li:hover { background:var(--blanco); }
  li .n { font-family:var(--serif); font-size:1.4rem; color:var(--laton); width:26px; text-align:right; }
  li .t { flex:1; }
  li .t b { display:block; font-family:var(--serif); font-size:1.35rem; font-weight:600; }
  li .t small { color:var(--gris); }
  li .d { color:var(--gris); font-variant-numeric:tabular-nums; }
  li.sonando .t b { color:var(--burdeos); }

  /* Mini reproductor */
  .mini { position:fixed; left:12px; right:12px; bottom:12px; max-width:536px; margin:0 auto; background:var(--ebano); color:var(--marfil);
          border-radius:18px; padding:12px 14px; display:none; align-items:center; gap:12px; cursor:pointer; box-shadow:0 10px 30px #0004; }
  .mini.on { display:flex; }
  .mini span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--serif); font-size:1.25rem; }
  .mini button { background:var(--burdeos); color:#fff; border:none; width:44px; height:44px; border-radius:50%; font-size:1.1rem; cursor:pointer; }

  /* Pantalla "Sonando" */
  .sonar { position:fixed; inset:0; background:var(--ebano); color:var(--marfil); display:none; flex-direction:column; overflow:auto; }
  .sonar.on { display:flex; }
  .sonar .wrap { flex:1; padding-bottom:20px; text-align:center; width:100%; }
  .sonar .top { display:flex; align-items:center; margin:28px 0; }
  .sonar .top button { width:56px; height:56px; border-radius:50%; border:2px solid #4a443d; background:none; color:var(--marfil); font-size:1.4rem; cursor:pointer; }
  .sonar .top .etq { flex:1; margin-right:56px; }
  .sonar h2 { font-family:var(--serif); font-weight:500; font-size:2.4rem; margin:0; line-height:1.05; }
  .sonar .cred { color:#d8cfbf; margin:8px 0 26px; }
  .sPortada { width:min(300px,75vw); aspect-ratio:1; object-fit:contain; border-radius:18px; border:3px solid var(--laton); display:block; margin:0 auto 14px; background:#000; }
  .tiempo { font-family:var(--serif); font-size:1.6rem; margin-bottom:18px; }
  .tiempo small { color:#d8cfbf; font-family:var(--sans); font-size:.95rem; }
  .vol { display:flex; align-items:center; gap:12px; margin:0 0 22px; color:#d8cfbf; font-size:1.3rem; }
  .vol input { flex:1; accent-color:var(--laton); height:28px; }
  #ytCaja { height:0; border:0 !important; aspect-ratio:auto; margin-top:12px; border-radius:14px; overflow:hidden; border:2px solid var(--laton); }
  #ytCaja.on { border:2px solid var(--laton) !important; width:100%; height:auto; aspect-ratio:16/9; }
  #ytCaja iframe { width:100%; height:100%; }
  .instalar { position:fixed; top:12px; left:12px; right:12px; max-width:536px; margin:0 auto; background:var(--burdeos); color:#fff; border-radius:16px;
              padding:14px 16px; display:none; align-items:center; gap:12px; z-index:10; box-shadow:0 10px 30px #0004; }
  .instalar.on { display:flex; }
  .instalar span { flex:1; }
  .instalar button { border:none; border-radius:12px; padding:10px 14px; font:700 1rem var(--sans); cursor:pointer; background:var(--marfil); color:var(--burdeos); }
  .instalar button.x { background:none; color:#fff; font-size:1.3rem; padding:6px; }
  .ctrl { display:flex; justify-content:center; align-items:center; gap:22px; margin-bottom:24px; }
  .ctrl button { width:70px; height:70px; border-radius:50%; border:2px solid var(--marfil); background:none; color:var(--marfil); font-size:1.4rem; cursor:pointer; }
  .ctrl button.pp { width:92px; height:92px; background:var(--burdeos); border-color:var(--burdeos); color:#fff; font-size:2rem; }
  .inst-capa { position:fixed; inset:0; background:#0009; display:flex; align-items:center; justify-content:center; padding:16px; z-index:20; }
  .inst-ventana { background:var(--blanco); color:var(--ebano); border-radius:20px; padding:22px; max-width:420px; width:100%; }
  .inst-pasos { list-style:decimal; padding-left:22px; margin:0 0 10px; line-height:1.5; }
  .inst-pasos li { display:list-item; border:none; padding:4px 0; cursor:default; }
  .inst-pasos li:hover { background:none; }
  .inst-nota { font-size:.9rem; color:var(--gris); margin:0 0 12px; }
  .inst-ventana .btn { margin-top:10px; font-size:1.05rem; padding:14px; }
  .inst-ventana .btn.borde { border-color:var(--ebano); color:var(--ebano); }
  .sonar .btn { margin-bottom:12px; }
  .piano { display:flex; height:90px; background:var(--marfil); position:relative; flex-shrink:0; }
  .piano i { flex:1; border-right:1px solid var(--ebano); }
  .piano em { position:absolute; top:0; width:4%; height:55%; background:var(--ebano); }
</style>
</head>
<body>
<div class="teclas"><i></i><i></i><i style="width:1px"></i><i class="r"></i><i></i></div>
<main class="wrap" id="app"></main>

<div class="mini" id="mini" onclick="abrirSonar()"><span id="miniT"></span><button id="miniB" onclick="event.stopPropagation();toggle()">❚❚</button></div>

<section class="sonar" id="sonar">
  <div class="wrap">
    <div class="top"><button onclick="cerrarSonar()">‹</button><span class="etq">Sonando</span></div>
    <h2 id="sT"></h2>
    <p class="cred" id="sC"></p>
    <img class="sPortada" id="sPortada" alt="Portada">
    <div class="tiempo"><span id="sTiempo">0:00</span> <small id="sDur"></small></div>
    <div class="ctrl"><button onclick="prev()">⏮</button><button class="pp" id="sPP" onclick="toggle()">❚❚</button><button onclick="next()">⏭</button></div>
    <div class="vol">🔈<input type="range" id="vol" min="0" max="100" value="100" oninput="volumen(this.value)">🔊</div>
    <button class="btn borde" id="sVer" onclick="verVideo()">▶ Ver vídeo</button>
    <div id="ytCaja"><div id="yt"></div></div>
  </div>
  <div class="piano" id="piano"></div>
</section>
<div class="instalar" id="instalar"><span id="instT">¿Instalar la app en tu dispositivo?</span>
  <button id="instB" onclick="instalar()">Instalar</button><button class="x" onclick="cerrarInst()">✕</button></div>

<script>
const VERSION = 'v1.9';
// Discos sacados del canal de YouTube @letyvidez4407 (listas de reproducción)
// Formato de cada canción: [id de vídeo, título, créditos, duración]
const DISCOS = [
  { n:4, titulo:'Noche de luna', anio:2025, canciones:[
    ['R-4vHeovLN4','Preludio para una noche de luna','Violín: Laura Orallo','5:30'],
    ['15B_W1TA_iA',"I'm in love",'Voz: Fernando Calabró · Percusión: Gisele Cornejo','4:01'],
    ['sZtb2Bwx5j0','Amar la vida','Voz: Gisele Cornejo','3:29'],
    ['5DShGHxw_aw','La danza de los duendes','','5:10'],
    ['bYHPzvCRT0w','Yo escribo tu nombre','Voz: Norberto Calabró','3:31'],
    ['zYDqGwqZ66o','Você é toda minha vida','Voz: Gisele Cornejo','4:38'],
    ['BfVDv3CdNKM','Fantasía en Re menor','','3:27'],
    ['l6kiqiG9S_g',"Je ne t'oublierai pas",'Voz: Fernando Calabró','4:10'],
    ['D0So3Pla0Wg','Evocaciones','','4:51'] ]},
  { n:3, titulo:'Azul intenso', anio:2023, canciones:[
    ['a-OG6lgD5ro','Destellos','','2:31'],
    ['2fNJ5creM6Y','Reencuentro','','2:34'],
    ['zoGbtKDWDzw','Je pense à toi','','2:39'],
    ['RqBqfnCiOag','Desde el alma','','3:18'],
    ['_KVBYm_yCas','Mis recuerdos','','3:23'],
    ['WVrOXkVO3lQ','Amor prohibido','','1:56'],
    ['w2iT3wC6Xww','Chicago Style','','2:44'],
    ['B0gwTdXX6GE','Azul intenso','','4:00'],
    ['wupTlTVDTg4','Amanecer tempestuoso','','3:19'] ]},
  { n:2, titulo:'Incertidumbre', anio:2022, canciones:[
    ['md_BVv0YJDA','Preludio','','2:41'],
    ['emso8o9ajbE','Te busco y no te encuentro','','2:24'],
    ['ylJkFTzMxX8','Otoño en Baden Baden','','3:28'],
    ['jx8Zvg5aN6c','Ascoltami e amami','','2:07'],
    ['wIxlSmjcQwI','Quizás mañana','','3:03'],
    ['kbOuUE4R6h0','Olvídate de mí','','2:42'],
    ['8e4thfoezwU','El resplandor de tu mirada','','5:33'],
    ['EM5I42Lqr7c','Incertidumbre','','3:14'] ]},
  { n:1, titulo:'Ensueños', anio:2021, canciones:[
    ['uRI_wRZs7-A','Dreaming','','3:47'],
    ['897nGiV_o0Y','Reencuentro','','2:42'],
    ['8PKNwtNnbEQ','Crepúsculo','','3:47'],
    ['9TtpLRRY7rI','The Time','','1:23'],
    ['rYprKSNAS44','Nostalgia','','5:01'],
    ['oGXaE-tP-6c','Despedida','','2:48'],
    ['4jyaH9UFPQM','Dilema','','4:41'],
    ['N6-FZOzs5WA','Barcarola','','4:58'],
    ['Jtj7Km6sWmk','Aires de mi tierra','','3:26'],
    ['fXkWZ30NBLY','Recuerdos','','2:53'] ]},
];

// Biografía (texto facilitado por la familia). Un elemento por párrafo.
const BIOGRAFIA = [
  'Lety Vídez es autora e intérprete de las piezas musicales de sus cinco discos publicados. Actualmente compone música para piano, fusión de clasicismo romántico con pinceladas modernas, fruto de sus influencias más intensas: Chopin, Gershwin, Piazzola o Bee Gees.',
  'Lety, nacida Leticia Benavidez Alessandro (Buenos Aires, 1937) ya fue una niña prodigio que -desde los 3 a los 5 años- formó parte de un programa diario de Radio Belgrano en el que niños y niñas con habilidades recitaban y cantaban en la emisora y también en teatros. A los 6 años empezó a estudiar danza clásica y a los 11 entró en el Conservatorio Municipal Manuel de Falla de Buenos Aires. Entre los 15 y los 18 años lo interrumpe para hacer una gira como bailarina de danza española y moderna con el Ballet de Carlos Manuel, actuando en diversas ciudades de Chile, Perú, Colombia y Venezuela. De vuelta a Buenos Aires continúa sus estudios de piano en el Conservatorio Alberto Williams convirtiéndose en profesora y obteniendo el 1er premio (Medalla de Oro).',
  'Estudia dos años de Historia del Arte en la U.B.A. para pasarse a la facultad de Psicología, donde se licencia con la especialidad de Psicoanálisis, continuando dicha especialidad en postgrados. En 1979 se muda con su familia a España (Madrid y Barcelona), donde ejerce de psicóloga y profesora de cursos psicoanalíticos.',
  'El piano fue siempre su instrumento preferido, interpretando las obras clásicas de Bach, Beethoven, Mozart, Liszt, Chopin, Debussy o Albéniz.',
  'Hace unos años surge una nueva faceta de su personalidad. Un sueño nocturno recurrente le dicta unas notas que ella traslada a una primera partitura propia. Esa fuente de inspiración y una dedicación creativa posterior la llevan a componer y grabar su primer disco: Ensueños (2021). Continuaría componiendo piezas musicales -con letras propias y con colaboraciones de otr@s cantantes- en sus siguientes discos, Incertidumbre (2022), Azul Intenso (2023) y Noche de Luna (2025), con canciones en español, italiano, inglés y francés. Actualmente está en proceso de grabación de su quinto disco: Entre tus Manos (lanzamiento previsto en diciembre de 2026). Además del formato CD, pueden escucharse en YouTube y Spotify.',
];

const app = document.getElementById('app');
const portada = d => `portadas/disco${d.n}.jpg?v=${VERSION}`; // ?v= obliga a pedir la portada nueva en cada versión
const mmss = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
let cola = [], actual = -1, yt, ytListo = false, pendiente = null;

// "La pieza de hoy": cambia cada día, la misma para todo el día
const todas = DISCOS.flatMap(d => d.canciones.map(c => ({ c, d })));
const hoy = todas[Math.floor(Date.now() / 864e5) % todas.length];

function saludo() {
  const h = new Date().getHours();
  return h < 6 ? 'Buenas noches,' : h < 13 ? 'Buenos días,' : h < 21 ? 'Buenas tardes,' : 'Buenas noches,';
}

function showList() {
  app.innerHTML = `
    <p class="saludo">${saludo()}</p>
    <div class="nombre"><h1><em>Lety Videz</em></h1><img src="lety-videz.png" alt="Lety Videz"></div>
    <section class="hoy">
      <div class="etq">La pieza de hoy</div>
      <h2>${hoy.c[1]}</h2>
      <p>${hoy.d.titulo}, ${hoy.d.anio}</p>
      <button class="btn" onclick="tocarHoy()">▷ Escuchar ahora</button>
    </section>
    <h3 class="subt">Discos</h3>
    <div class="discos">${DISCOS.map(d => `
      <a class="disco" href="#disco/${d.n}">
        <img src="${portada(d)}" alt="">
        <div><b>${d.titulo}</b><small>${d.anio}</small></div>
      </a>`).join('')}</div>
    <section class="bio" id="bio">
      <button type="button" class="bioBtn" onclick="document.getElementById('bio').classList.toggle('open')">Biografía</button>
      <div>${BIOGRAFIA.map(p => `<p>${p}</p>`).join('')}</div>
    </section>
    <p style="text-align:center;color:var(--gris);font-size:.8rem">${VERSION}</p>`;
}

function showAlbum(n) {
  const d = DISCOS.find(x => x.n == n);
  if (!d) return showList();
  app.innerHTML = `
    <a class="volver" href="#">‹</a>
    <img class="caratula" src="${portada(d)}" alt="Carátula">
    <div class="cab"><h2>${d.titulo}</h2><p>${d.anio} · ${d.canciones.length} canciones</p>
    <button class="btn" onclick="tocarDisco(${d.n},0)">▷ Escuchar el disco</button></div>
    <ol>${d.canciones.map((c,i) => `
      <li data-i="${i}" onclick="tocarDisco(${d.n},${i})"><span class="n">${i+1}</span>
      <span class="t"><b>${c[1]}</b>${c[2] ? `<small>${c[2]}</small>` : ''}</span>
      <span class="d">${c[3]}</span></li>`).join('')}</ol>`;
  marcar();
}

function tocarDisco(n, i) { cola = DISCOS.find(x => x.n == n).canciones; play(i); abrirSonar(); }
function tocarHoy() { tocarDisco(hoy.d.n, hoy.d.canciones.indexOf(hoy.c)); }

function marcar() {
  const id = cola[actual]?.[0];
  const d = DISCOS.find(x => x.n == location.hash.split('/')[1]);
  document.querySelectorAll('li').forEach(li => li.classList.toggle('sonando', !!d && d.canciones[+li.dataset.i][0] === id));
}

// Reproductor de YouTube oculto: suena la canción completa
function onYouTubeIframeAPIReady() {
  yt = new YT.Player('yt', { height:'100%', width:'100%', playerVars:{ playsinline:1 },
    events: {
      onReady: () => { ytListo = true; if (pendiente) { yt.loadVideoById(pendiente); pendiente = null; } },
      onStateChange: e => { if (e.data === YT.PlayerState.ENDED) next(); botones(e.data === YT.PlayerState.PLAYING); },
      onError: () => next()
    }});
}
function botones(sonando) {
  document.getElementById('miniB').textContent = sonando ? '❚❚' : '▶';
  document.getElementById('sPP').textContent = sonando ? '❚❚' : '▶';
}
function play(i) {
  const c = cola[i];
  if (!c) return;
  actual = i;
  document.getElementById('miniT').textContent = '♪ ' + c[1];
  document.getElementById('mini').classList.add('on');
  document.getElementById('sT').textContent = c[1];
  document.getElementById('sC').textContent = c[2] || 'Lety Videz';
  document.getElementById('sDur').textContent = '/ ' + c[3];
  document.getElementById('sTiempo').textContent = '0:00';
  document.getElementById('sPortada').src = portada(DISCOS.find(d => d.canciones === cola));
  ytListo ? yt.loadVideoById(c[0]) : pendiente = c[0];
  marcar();
}
function next() { play(actual + 1); }
function prev() { play(Math.max(0, actual - 1)); }
function toggle() { if (!ytListo) return; yt.getPlayerState() === YT.PlayerState.PLAYING ? yt.pauseVideo() : yt.playVideo(); }
function volumen(v) { if (ytListo) { yt.setVolume(+v); yt.unMute(); } }
function verVideo() {
  const on = document.getElementById('ytCaja').classList.toggle('on');
  document.getElementById('sVer').textContent = on ? '✕ Ocultar vídeo' : '▶ Ver vídeo';
}

// Botón "Instalar la app"
let avisoInst = null;
const yaInstalada = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
addEventListener('beforeinstallprompt', e => { e.preventDefault(); avisoInst = e; if (!yaInstalada) document.getElementById('instalar').classList.add('on'); });
if (esIOS && !yaInstalada) document.getElementById('instalar').classList.add('on');

// Instrucciones copiadas de Metas Amables: en iPhone (Apple no deja instalar con un
// botón) se muestran los pasos en una ventana; en Android, si no sale la ventana del navegador, también.
const ICONO_COMPARTIR_IOS = '<svg viewBox="0 0 24 24" width="18" height="18" style="vertical-align:-3px" fill="none" stroke="#007AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Compartir"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M8 11H6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-2"/></svg>';
async function instalar() {
  if (avisoInst && !esIOS) { avisoInst.prompt(); try { await avisoInst.userChoice; } catch(e){} avisoInst = null; cerrarInst(); return; }
  const safari = esIOS && !/crios|fxios|edgios|opios/i.test(navigator.userAgent);
  const pasos = esIOS
    ? (safari
      ? '<ol class="inst-pasos"><li>Toca los <b>tres puntos •••</b>, abajo a la derecha de Safari.</li><li>Toca <b>Compartir</b> ' + ICONO_COMPARTIR_IOS + '.</li><li>Abajo, toca <b>«Ver más»</b> y luego <b>«Añadir a pantalla de inicio»</b>.</li><li>Toca <b>«Añadir»</b>, arriba a la derecha.</li></ol><p class="inst-nota">Si no ves los tres puntos, toca directamente el botón Compartir ' + ICONO_COMPARTIR_IOS + ' de la barra de abajo. Después abre la app desde el icono nuevo de tu pantalla de inicio.</p>'
      : '<p>En iPhone la app solo se puede instalar desde <b>Safari</b>.</p><ol class="inst-pasos"><li>Toca el botón de abajo para copiar la dirección.</li><li>Abre <b>Safari</b> y pégala en la barra de arriba.</li><li>Allí vuelve a tocar «Instalar».</li></ol><button type="button" class="btn inst-copiar">Copiar la dirección</button>')
    : '<ol class="inst-pasos"><li>Toca los <b>tres puntos ⋮</b>, arriba a la derecha del navegador.</li><li>Toca <b>«Instalar aplicación»</b> o <b>«Añadir a pantalla de inicio»</b>.</li><li>Confirma con <b>«Instalar»</b>.</li></ol><p class="inst-nota">Si ya la tenías y el icono falla, bórralo primero y vuelve a hacer estos pasos.</p>';
  const capa = document.createElement('div');
  capa.className = 'inst-capa';
  capa.innerHTML = `<div class="inst-ventana" role="dialog" aria-label="Instalar la app">
    <p style="font-size:1.2rem;margin:0 0 10px"><b>📲 Instalar la app Lety Videz</b></p>${pasos}
    <button type="button" class="btn borde inst-cerrar">Cerrar</button></div>`;
  capa.onclick = e => { if (e.target === capa || e.target.classList.contains('inst-cerrar')) capa.remove(); };
  const copiar = capa.querySelector('.inst-copiar');
  if (copiar) copiar.onclick = async () => {
    const url = location.origin + location.pathname;
    try { await navigator.clipboard.writeText(url); copiar.textContent = '✓ Copiada'; } catch(e){ copiar.textContent = url; }
  };
  document.body.appendChild(capa);
}
function cerrarInst() { document.getElementById('instalar').classList.remove('on'); }
addEventListener('appinstalled', cerrarInst);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');

function abrirSonar() { document.getElementById('sonar').classList.add('on'); }
function cerrarSonar() { document.getElementById('sonar').classList.remove('on'); }
setInterval(() => { if (ytListo && yt.getCurrentTime) document.getElementById('sTiempo').textContent = mmss(yt.getCurrentTime() || 0); }, 500);

// Teclado decorativo de la pantalla "Sonando"
document.getElementById('piano').innerHTML = '<i></i>'.repeat(7) +
  [1,2,4,5,6].map(k => `<em style="left:calc(${k*100/7}% - 2%)${k===5?';background:var(--burdeos)':''}"></em>`).join('');

// Deslizar el dedo hacia la derecha = volver a la pantalla anterior
let toque = null;
addEventListener('touchstart', e => { const t = e.touches[0]; toque = { x:t.clientX, y:t.clientY, en:e.target }; }, { passive:true });
addEventListener('touchend', e => {
  if (!toque) return;
  const t = e.changedTouches[0], dx = t.clientX - toque.x, dy = t.clientY - toque.y;
  const enVolumen = toque.en.closest && toque.en.closest('.vol, #ytCaja');
  toque = null;
  if (enVolumen || dx < 80 || Math.abs(dy) > Math.abs(dx) * 0.6) return;
  atras();
}, { passive:true });
function atras() {
  if (document.querySelector('.inst-capa')) return document.querySelector('.inst-capa').remove();
  if (document.getElementById('sonar').classList.contains('on')) return cerrarSonar();
  if (location.hash) location.hash = '';
}

function route() {
  const m = location.hash.match(/^#disco\/(\d+)/);
  m ? showAlbum(m[1]) : showList();
  scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
